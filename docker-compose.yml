services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guulingiinhan
      POSTGRES_USER: guulingiinhan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guulingiinhan -d guulingiinhan"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://guulingiinhan:${POSTGRES_PASSWORD:-local-development-only}@db:5432/guulingiinhan
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
